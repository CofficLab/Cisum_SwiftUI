name: Pre Release

on:
  push:
    tags:
      - "p*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读取版本号
        id: version
        run: |
          # 查找 Xcode 项目文件
          projectFile=$(find $(pwd) -type f -name "*.pbxproj" | head -n 1)

          # 从 Xcode 配置文件读取版本号
          VERSION=$(grep -o 'MARKETING_VERSION = [^"]*' "$projectFile" | head -n 1 | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+')

          # 添加 p 前缀作为标签名
          TAG_NAME="p${VERSION}"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"
          echo "🏷️  Tag: $TAG_NAME"

      - name: 显示变更摘要
        run: |
          echo "### 🚀 Pre-release 版本发布" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **发布版本**: ${{ steps.version.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **版本号**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **来源**: Xcode 配置文件" >> $GITHUB_STEP_SUMMARY

      - name: Generate Changelog
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag_name }}
        run: |
          chmod +x .github/scripts/generate-changelog.sh
          ./.github/scripts/generate-changelog.sh "${{ github.workspace }}-CHANGELOG.txt"

      - name: Display Changelog
        run: cat "${{ github.workspace }}-CHANGELOG.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          body_path: ${{ github.workspace }}-CHANGELOG.txt
          prerelease: true
          draft: false
          files: |
            ./**/*.dmg
            ./**/*.zip
            ./**/*.exe
            ./**/*.pkg
            ./**/*.deb
            ./**/*.ipa
            ./**/*.AppImage
            ./**/*.snap
